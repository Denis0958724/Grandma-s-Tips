<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Поради бабусі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a phone frame on a blush "tablecloth"; inside — scrolling screen over a fixed 5-tab bar, bottom sheets slide up.
   On phones (<560px) the frame disappears and the app fills the screen. Granny's voice = handwriting (Caveat) on lined notebook paper,
   section dividers = cross-stitch (вишивка) in rose and plum. */
:root{
  --desk:#F1E1DF; --bg:#FCF5F2; --card:#FFFFFF; --card-2:#F8ECEA; --ink:#3A2838; --ink-2:#776274; --line:#EEDCDB;
  --rose:#E7A1AC; --rose-deep:#B04C66; --sage:#CFE0C8; --sage-deep:#43683D; --butter:#F8E7B4; --butter-deep:#86650E; --lilac:#E2D8F0;
  --skin:#F4CDB6; --hair:#E8E3EC; --hair-2:#C9C0D0; --frame:#2F2330; --on-accent:#FFFFFF; --scrim:rgba(40,24,36,.42);
  --shadow:0 1px 2px rgba(58,40,56,.06), 0 10px 26px rgba(58,40,56,.08);
  --paper-line:#EADCE4; --margin:#EAA3B0;
  --st-single:#b04c66; --st-married:#2a78d6; --st-divorced:#1baf7a; --st-widowed:#eda100;
  --f-display:'Comfortaa','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
  --r-s:12px; --r-m:18px; --r-l:24px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#140F14; --bg:#1D161C; --card:#291F27; --card-2:#33272F; --ink:#F6EAEE; --ink-2:#BCA9B8; --line:#3F313B;
  --rose:#C9798A; --rose-deep:#F1A7B7; --sage:#3E5539; --sage-deep:#A9D09F; --butter:#5C4C22; --butter-deep:#F0D27A; --lilac:#453A57;
  --skin:#E6BFA8; --hair:#DCD6E0; --hair-2:#ABA2B2; --frame:#0A070A; --on-accent:#2B1520; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.3); --paper-line:#3A2E37; --margin:#7E4556; --st-single:#d4688a; --st-married:#3987e5; --st-divorced:#199e70; --st-widowed:#c98500; color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#140F14; --bg:#1D161C; --card:#291F27; --card-2:#33272F; --ink:#F6EAEE; --ink-2:#BCA9B8; --line:#3F313B;
  --rose:#C9798A; --rose-deep:#F1A7B7; --sage:#3E5539; --sage-deep:#A9D09F; --butter:#5C4C22; --butter-deep:#F0D27A; --lilac:#453A57;
  --skin:#E6BFA8; --hair:#DCD6E0; --hair-2:#ABA2B2; --frame:#0A070A; --on-accent:#2B1520; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.3); --paper-line:#3A2E37; --margin:#7E4556; --st-single:#d4688a; --st-married:#3987e5; --st-divorced:#199e70; --st-widowed:#c98500; color-scheme:dark }

html,body{min-height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased}
html.lock, html.lock body{overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
svg.ic{width:20px; height:20px; flex:none; display:inline-block; vertical-align:middle}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose); outline-offset:2px; border-radius:10px}

/* Shell. Phone: one column + fixed bottom tabs. Laptop (>=900px): sticky sidebar + wide content with grids. */
.shell{min-height:100vh}
.sidebar{display:none}
.view{display:block; width:100%; max-width:760px; margin:0 auto; padding:14px 18px calc(100px + env(safe-area-inset-bottom, 0px))}
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(6,1fr); background:var(--card); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px))}
.tab{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; font-size:11px; font-weight:800; color:var(--ink-2); border-radius:14px}
.tab svg.ic{width:24px; height:24px}
.tab.on{color:var(--rose-deep)}
.tab.on svg .fillable, .snav button.on svg .fillable{fill:var(--rose); fill-opacity:.35}

.sidebar .brand{display:flex; gap:12px; align-items:center; padding:0 6px}
.sidebar .brand b{font-family:var(--f-display); font-size:19px; display:block; line-height:1.2}
.snav{display:flex; flex-direction:column; gap:4px}
.snav button{display:flex; align-items:center; gap:12px; border:0; background:none; padding:11px 12px; border-radius:14px; font-weight:800; font-size:15px; color:var(--ink-2); text-align:left}
.snav button svg.ic{width:22px; height:22px}
.snav button:hover{background:var(--card-2); color:var(--ink)}
.snav button.on{background:var(--card-2); color:var(--rose-deep)}
.sidebar .spacer{flex:1}
.mini-pro{border-radius:18px; padding:14px; background:var(--butter); display:flex; flex-direction:column; gap:8px}
.sidebar details{border-top:1px solid var(--line); padding-top:12px}
.sidebar summary{cursor:pointer; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); padding:4px 6px}
.tester{display:flex; flex-direction:column; gap:10px; padding:10px 6px 0; font-size:13.5px}
.tester ol,.tester ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:3px; color:var(--ink-2)}

/* content grids */
.today-grid{display:grid; gap:14px}
.col{display:flex; flex-direction:column; gap:14px; min-width:0}
.grid-cards{display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 290px), 1fr))}
.two-col{display:grid; gap:14px}
.prof-cols{display:flex; flex-direction:column; gap:14px}
@media (min-width:720px){
  .prof-cols{display:block; columns:2; column-gap:16px}
  .prof-cols > *{break-inside:avoid; margin-bottom:16px}
  .two-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start}
}
@media (min-width:900px){
  .shell{display:grid; grid-template-columns:264px minmax(0,1fr)}
  .sidebar{display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; overflow-y:auto; padding:26px 16px 20px; background:var(--card); border-right:1px solid var(--line)}
  .tabbar{display:none}
  .view{max-width:1140px; padding:36px 44px 64px}
  .today-grid{grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr); gap:24px; align-items:start}
}

/* type */
.h1{font-family:var(--f-display); font-weight:700; font-size:23px; line-height:1.25; margin:0; text-wrap:balance; letter-spacing:-.01em}
.h2{font-family:var(--f-display); font-weight:700; font-size:17px; line-height:1.3; margin:0; text-wrap:balance}
.hand{font-family:var(--f-hand); font-weight:500; font-size:23px; line-height:1.15}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.eyebrow{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2)}
p{margin:0}

/* building blocks */
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; align-items:center; gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--card); border-radius:var(--r-l); padding:16px; box-shadow:var(--shadow)}
.card.flat{box-shadow:none; background:var(--card-2)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 18px; border-radius:16px; font-weight:800; font-size:15px; border:0; background:var(--rose-deep); color:var(--on-accent); text-decoration:none}
.btn svg{width:18px; height:18px}
.btn.soft{background:var(--card-2); color:var(--ink)}
.btn.ghost{background:transparent; color:var(--rose-deep); padding:0 8px}
.btn.sm{min-height:36px; padding:0 13px; font-size:13.5px; border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.icon-btn{width:40px; height:40px; border-radius:50%; border:0; background:var(--card-2); display:grid; place-items:center; flex:none; position:relative}
.icon-btn svg.ic{width:20px; height:20px}
.dot{position:absolute; top:8px; right:9px; width:8px; height:8px; border-radius:50%; background:var(--rose-deep); border:2px solid var(--card-2)}
.chip{display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px; background:var(--card-2); font-weight:700; font-size:13.5px; border:0; color:var(--ink); white-space:nowrap}
.chip.on{background:var(--rose-deep); color:var(--on-accent)}
.chip svg{width:14px; height:14px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips.scroll{flex-wrap:nowrap; overflow-x:auto; margin:0 -18px; padding:2px 18px 6px; scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.tag{display:inline-flex; align-items:center; gap:5px; white-space:nowrap; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:800; background:var(--card-2); color:var(--ink)}
.cat-care{background:var(--sage)} .cat-conflict{background:var(--lilac)} .cat-attention{background:var(--butter)}
.cat-words{background:var(--card-2)} .cat-home{background:var(--sage)} .cat-romance{background:var(--rose); color:var(--ink)}
.tag.ai{background:var(--lilac)}
.tag.pro{background:var(--butter); color:var(--butter-deep)}
.field{display:flex; flex-direction:column; gap:6px}
.field label,.lbl{font-size:13px; font-weight:800; color:var(--ink-2)}
.input{width:100%; min-height:48px; border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:10px 14px; font-size:16px; outline:none}
.input:focus{border-color:var(--rose)}
textarea.input{min-height:84px; resize:vertical}
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--card-2); border-radius:14px; padding:4px; gap:4px}
.seg button{border:0; background:transparent; border-radius:11px; min-height:38px; font-weight:800; font-size:13.5px; color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center; gap:5px}
.seg button svg.ic{width:15px; height:15px}
.seg button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
.list{display:flex; flex-direction:column}
.li{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1; min-width:0}
.switch{position:relative; width:50px; height:30px; flex:none; border-radius:999px; border:0; background:var(--line); transition:background .2s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .2s}
.switch.on{background:var(--sage-deep)}
.switch.on::after{transform:translateX(20px)}
.stitch{display:block; width:100%; height:8px}
.st-a{stroke:var(--rose-deep); stroke-width:1.6; stroke-linecap:round}
.st-b{stroke:var(--ink); stroke-width:1.6; stroke-linecap:round; opacity:.75}
.sec-title{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:6px}

/* granny */
.granny{display:block; width:100%; height:100%}
.g-bg{fill:var(--g-bg, var(--butter))} .g-coat{fill:var(--g-coat, var(--rose))} .g-skin{fill:var(--skin)} .g-hair{fill:var(--hair)} .g-hair2{fill:var(--hair-2)}
.g-scarf{fill:var(--g-scarf, var(--sage))} .g-dots{fill:var(--card); opacity:.75}
.g-glass{fill:none; stroke:var(--ink); stroke-width:2} .g-line{fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round}
.g-cheek{fill:var(--rose); opacity:.55} .g-x{stroke:var(--rose-deep); stroke-width:1.8; stroke-linecap:round}
.g-collar{fill:none; stroke:var(--card); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.av{flex:none; border-radius:50%; overflow:hidden; background:var(--butter)}
.av img{width:100%; height:100%; object-fit:cover; display:block}
.bubble{position:relative; background:var(--card); border-radius:20px 20px 20px 6px; padding:10px 14px; box-shadow:var(--shadow)}

/* notebook page — granny's advice */
.page{position:relative; border-radius:var(--r-l); background-color:var(--card); box-shadow:var(--shadow); padding:18px 18px 16px 34px;
  background-image:linear-gradient(90deg, transparent 22px, var(--margin) 22px, var(--margin) 23.5px, transparent 23.5px),
                   repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-line) 27px 28px);
  background-position:0 0, 0 14px}
.page .hand.title{font-size:30px; font-weight:700; line-height:1.05; color:var(--rose-deep)}
.task{display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:16px; background:var(--card-2); border:0; text-align:left; width:100%}
.check{flex:none; width:26px; height:26px; border-radius:9px; border:2px solid var(--rose-deep); display:grid; place-items:center; background:var(--card)}
.check svg{width:16px; height:16px; opacity:0}
.task.done .check{background:var(--rose-deep)}
.task.done .check svg{opacity:1; stroke:var(--on-accent)}
.task.done .task-t{text-decoration:line-through; text-decoration-color:var(--rose)}

/* countdown */
.count{display:flex; gap:14px; align-items:center}
.count .num{flex:none; width:64px; height:64px; border-radius:20px; background:var(--lilac); display:flex; flex-direction:column; align-items:center; justify-content:center; font-variant-numeric:tabular-nums}
.count .num b{font-family:var(--f-display); font-size:24px; line-height:1}
.count .num span{font-size:11px; font-weight:800; color:var(--ink-2)}
.count.soon .num{background:var(--rose)}

/* advice list */
.adv{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; border:0; background:var(--card); border-radius:var(--r-m); padding:14px; box-shadow:var(--shadow)}
.adv .day{flex:none; width:42px; text-align:center; font-family:var(--f-hand); font-size:26px; font-weight:700; color:var(--rose-deep); line-height:1}
.adv .day small{display:block; font-family:var(--f-body); font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2)}
.adv .grow{flex:1; min-width:0}
.adv .ex{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:13.5px; color:var(--ink-2)}
.adv.locked .ex{filter:blur(3.5px); user-select:none}
.adv.read .day{color:var(--sage-deep)}
.lock{width:18px; height:18px; flex:none; color:var(--ink-2); display:inline-grid; place-items:center}
.lock svg.ic{width:16px; height:16px}
.progress{height:8px; border-radius:99px; background:var(--card-2); overflow:hidden}
.progress i{display:block; height:100%; background:var(--sage-deep); border-radius:99px}

/* ideas */
.idea{background:var(--card); border-radius:var(--r-m); padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px}
.idea .t{font-weight:800; font-size:16px; line-height:1.3}
.idea .why{font-size:14px; color:var(--ink-2)}
.idea .acts{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:auto}
.idea.done{opacity:.6}
.skel{border-radius:var(--r-m); height:112px; background:linear-gradient(90deg, var(--card-2) 0%, var(--card) 50%, var(--card-2) 100%); background-size:200% 100%; animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.ai-box{border-radius:var(--r-l); padding:16px; background:var(--lilac); display:flex; flex-direction:column; gap:10px}
.focus-banner{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:16px; background:var(--butter)}
.focus-banner > svg{width:22px; height:22px; flex:none}
.focus-banner .grow{flex:1; min-width:0; font-size:13.5px}

/* profile */
.ph{display:flex; gap:14px; align-items:center}
.ph .ini{width:64px; height:64px; border-radius:22px; background:var(--rose); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:26px; color:var(--ink); flex:none}
.psec{background:var(--card); border-radius:var(--r-m); box-shadow:var(--shadow); padding:14px 16px}
.psec .head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px}
.kv dt{color:var(--ink-2); font-weight:700} .kv dd{margin:0; min-width:0; overflow-wrap:anywhere}
.empty{color:var(--ink-2); font-size:14px; font-style:italic}
.pro-card{border-radius:var(--r-l); padding:16px; background:var(--butter); display:flex; flex-direction:column; gap:10px}
.pro-card .h2{color:var(--ink)}

/* grannies section */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.link-btn{border:0; background:none; padding:0; color:var(--rose-deep); font:inherit; text-decoration:underline; text-transform:none; letter-spacing:0}
.role-seg{min-width:260px}
.fy-grid{display:grid; gap:18px}
.pbar{display:grid; grid-template-columns:150px minmax(0,1fr) 42px; align-items:center; gap:10px; font-size:13.5px}
.pbar .pt{height:10px; border-radius:99px; background:var(--card-2); overflow:hidden}
.pbar .pt i{display:block; height:100%; border-radius:0 4px 4px 0; min-width:2px}
.pbar .pv{text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
.how{border-top:1px solid var(--line); margin-top:16px; padding-top:16px}
.chart-wrap{position:relative; width:100%; min-height:220px}
.chart-wrap svg{display:block; max-width:100%; height:auto; touch-action:pan-y}
.ch-grid{stroke:var(--line); stroke-width:1}
.ch-axis{fill:var(--ink-2); font-size:11px; font-family:var(--f-body)}
.ch-lbl{fill:var(--ink); font-size:11.5px; font-weight:700; font-family:var(--f-body)}
.ch-line{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.ch-you{stroke:var(--ink-2); stroke-width:1.5; stroke-dasharray:4 4}
.ch-dot{stroke:var(--card); stroke-width:2}
.ch-cross{stroke:var(--ink-2); stroke-width:1}
.tip{position:absolute; pointer-events:none; background:var(--card); box-shadow:var(--shadow); border:1px solid var(--line); border-radius:12px; padding:8px 10px; font-size:12.5px; min-width:190px; display:flex; flex-direction:column; gap:3px; z-index:2}
.tip .r{display:flex; align-items:center; gap:10px; justify-content:space-between}
.sw{width:10px; height:10px; border-radius:3px; display:inline-block; flex:none}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
input[type=range]{width:100%; accent-color:var(--rose-deep)}
.gcard{background:var(--card); border-radius:var(--r-l); box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:10px}
.gname{font-family:var(--f-display); font-size:16.5px; display:block; line-height:1.25}
.gq{font-size:21px; color:var(--rose-deep)}
.t-relationships{background:var(--rose)} .t-family{background:var(--lilac)} .t-kindness{background:var(--butter)} .t-support{background:var(--sage)}
.match{font-weight:800; color:var(--sage-deep)}
.gp-head{display:flex; gap:16px; align-items:center}
.media{display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:16px; background:var(--card); box-shadow:var(--shadow)}
.media.on{outline:2px solid var(--rose)}
.media .grow{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
.play{width:44px; height:44px; border-radius:50%; border:0; background:var(--rose-deep); color:var(--on-accent); display:grid; place-items:center; flex:none}
.play svg.ic{width:18px; height:18px}
.vscreen{border-radius:14px; background:var(--lilac); padding:16px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
.vsub,.asub{font-size:15px; font-weight:700; min-height:44px}
.asub{background:var(--card-2); border-radius:12px; padding:8px 10px}
.media audio,.media video{width:100%; border-radius:12px}
.stats{display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 180px), 1fr))}
.stat{background:var(--card); border-radius:var(--r-m); box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:2px}
.stat b{font-family:var(--f-display); font-size:26px; font-variant-numeric:tabular-nums}

const ADVICE = [
 {c:'attention', t:'Слухай очима', x:'Коли кохана людина розповідає про свій день, поклади телефон екраном донизу. Дід Петро п’ятдесят років слухав мене, дивлячись в очі, навіть коли я переказувала, що сказала сусідка. Отак любов і тримається.', k:'Під час вечірньої розмови прибери телефон на 15 хвилин.'},

 {c:'attention', t:'Запам’ятай дрібницю', x:'Яку каву п’є, яку пісню наспівує, як звали першого собаку. Хто пам’ятає дрібниці, той каже без слів: «Ти мені важлива людина». Запиши в мій зошит, я нагадаю.', k:'Дізнайся одну нову дрібницю й додай її в профіль.'},

 {c:'conflict', t:'Вибачитися — не програти', x:'«Вибач, я помилився» чи «вибач, я помилилася» — три слова, від яких ще ніхто не вмер. А от через гордість багато пар розійшлося. Вибачайся щиро і без «але».', k:'Якщо є за що — вибачся без «але».'},

 {c:'care', t:'Підтримай мрію', x:'Хоче на курси гончарства чи бігти марафон — не смійся, а питай, чим допомогти. Крила виростають, коли поруч хтось вірить.', k:'Спитай, чим ти можеш допомогти в її чи його задумі.'},
 {c:'home', t:'Три важливі речі', x:'Хтось розкидає шкарпетки, хтось не закриває пасту. Вибери три речі, які справді важливі, а на решту махни рукою. Ідеальних людей немає, {voc}, є терплячі.', k:'Запиши три звички, на які ти більше не зважатимеш.'},

 {c:'words', t:'Комплімент без приводу', x:'Найкращий комплімент — несподіваний. Не на свято, а у звичайний вівторок: «Мені з тобою так спокійно».', k:'Скажи комплімент без жодного приводу.'},

function nextOcc(iso){ // iso YYYY-MM-DD або MM-DD
  const parts = iso.split('-').map(Number); const [y,m,d] = parts.length===3 ? parts : [null, parts[0], parts[1]];
  const t = today(); let c = new Date(t.getFullYear(), m-1, d);
  if(c < t) c = new Date(t.getFullYear()+1, m-1, d);
  return {date:c, days:Math.round((c - t)/864e5), years: y ? c.getFullYear()-y : null};
}

}

  [ {title:'Захід сонця на найвищій точці міста', why:'Красиво, безкоштовно і дуже романтично.', meta:(p.city? p.city+' · ':'')+'вечір · безкоштовно'},
    {title:'Пікнік у парку', why:'Плед, термос і бутерброди.', meta:'день · до 300 ₴'},

function isDone(kind, title){ const id = hash(kind+title); return S.doneIdeas.some(d=>d.id===id); }
function doneTitles(kind){ return S.doneIdeas.filter(d=>d.title && (!kind || d.kind===kind)).slice(-40).map(d=>d.title); }
// Нові ідеї за правилами: без уже виконаних і, якщо можна, без тих, що зараз на екрані
function freshRules(kind, exclude=[]){
  const pool = ruleIdeas(UI.focus)[kind].filter(x=>!isDone(kind, x.title));
  const fresh = pool.filter(x=>!exclude.includes(x.title));
  const out = fresh.slice(0,4);
  for(const x of pool){ if(out.length>=4) break; if(!out.includes(x)) out.push(x); }
  return {items:out, exhausted:fresh.length===0};
}
function currentIdeas(){
  if(!S.ideas){ S.ideas = {src:'rules', gifts:freshRules('gifts').items, acts:freshRules('acts').items, dates:freshRules('dates').items, granny:''}; save(); }
  return S.ideas;
}

// ---------- ШІ: Claude у браузері → локальний сервер (server.py) → без ШІ ----------
let SAMPLE = null, AI_STATE = 'checking'; // checking | ready | off
let AI_SOURCE = 'none';                    // claude | local | local-unconfigured | none
let AI_MODEL = '', AI_HINT = '';
(async ()=>{
  await null; // дочекатися, поки скрипт повністю визначиться
  try{ SAMPLE = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('sample') : null; }catch(e){ SAMPLE = null; }
  if(SAMPLE) AI_SOURCE = 'claude';
  else SAMPLE = await connectLocalAI();
  AI_STATE = SAMPLE ? 'ready' : 'off'; render();
})();

// Локальний сервер (server.py) має той самий інтерфейс, що й Claude: sample(input, opts) і sample.json(...)
async function connectLocalAI(){
  if(!/^https?:$/.test(location.protocol)) return null;
  try{
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch('/api/health', {signal: ctl.signal, cache: 'no-store'}); clearTimeout(t);
    if(!r.ok) return null;
    const h = await r.json(); if(!h || !h.ok) return null;
    if(h.search === 'claude' || h.search === 'ollama') SEARCH_MODE = h.search; else SEARCH_HINT = h.search === 'none' ? 'Щоб шукати прямо в інтернеті, впиши безкоштовний ключ OLLAMA_API_KEY (ollama.com/settings/keys) або ключ Claude API в ai-settings.txt.' : '';
    if(!h.configured){ AI_SOURCE = 'local-unconfigured'; AI_HINT = h.message || ''; return null; }
    AI_SOURCE = 'local'; AI_MODEL = h.model || ''; return makeLocalSample();
  }catch(e){ return null; }
}
function makeLocalSample(){
  async function call(input, opts = {}, asJson = false){
    const list = typeof input === 'string' ? [{role:'user', content:input}] : input.map(m => ({role:m.role, content:String(m.content)}));
    const messages = [];
    for(const m of list){ const last = messages[messages.length-1]; if(last && last.role === m.role) last.content += '\n\n' + m.content; else messages.push({...m}); }
    let res;
    try{
      res = await fetch('/api/ai', {method:'POST', headers:{'Content-Type':'application/json', 'X-Babusya':'1'},
        body: JSON.stringify({messages, tier: opts.modelTier || 'default', json: asJson}), signal: opts.signal});
    }catch(e){ throw {code: opts.signal && opts.signal.aborted ? 'cancelled' : 'upstream_error', message: 'Сервер ШІ не відповідає. Чи відкрите вікно «Запустити з ШІ»?', local: true}; }
    if(!res.ok){
      let j = {}; try{ j = await res.json(); }catch(_){}
      const code = j.code === 'rate_limited' ? 'rate_limited' : (j.code === 'not_configured' || j.code === 'bad_key') ? 'not_granted' : 'upstream_error';
      throw {code, message: j.message || ('Помилка сервера ' + res.status), local: true};
    }
    const reader = res.body.getReader(), dec = new TextDecoder(); let text = '';
    try{
      for(;;){ const {done, value} = await reader.read(); if(done) break; const d = dec.decode(value, {stream:true});
        if(d){ text += d; if(opts.onText && !asJson){ try{ opts.onText({text, delta:d}); }catch(_){} } } }
    }catch(e){ throw {code: opts.signal && opts.signal.aborted ? 'cancelled' : 'upstream_error', message: 'Відповідь обірвалася.', text, local: true}; }
    if(!text.trim()) throw {code:'empty_completion', message:'Модель нічого не відповіла.', local: true};
    return {text, truncated:false, modelTierApplied: opts.modelTier || 'default'};
  }
  const sample = (input, opts) => call(input, opts, false);
  sample.json = async (input, opts = {}) => {
    const {text} = await call(input, opts, true); const v = parseLooseJSON(text);
    if(v === undefined) throw {code:'invalid_json', message:'Модель відповіла не у форматі JSON. Спробуй ще раз.', text, local: true};
    return v;
  };
  return sample;
}
function parseLooseJSON(t){
  try{ return JSON.parse(t); }catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch(e){} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if(a >= 0 && b > a){ try{ return JSON.parse(t.slice(a, b+1)); }catch(e){} }
  return undefined;
}

const AI_RULES = `Ти — бабуся Ганна з застосунку «Поради бабусі»: мудра, тепла, з легким гумором, 52 роки в шлюбі з дідом Петром. Допомагаєш людям робити стосунки теплішими.

Не вигадуй назв конкретних кафе, ресторанів чи магазинів. Для місць описуй тип місця («тихе кафе з книжковими полицями»); загальновідомі публічні місця міста (великі парки, набережні) можна називати, лише якщо ти впевнена, що вони існують.

async function runAI(kind){ // kind: undefined = всі списки, або 'gifts'|'acts'|'dates'
  if(AI_STATE!=='ready' || UI.loading) return;
  if(aiLeft()<=0){ openSheet('sub', {reason:'ai'}); return; }
  UI.loading = kind || 'all'; UI.aiNote=''; render(); loadTicker();
  const ctl = new AbortController(); UI.ctl = ctl;
  const focus = UI.focus ? `\nОсобливий привід: ${UI.focus.title}, ${fmtDM(UI.focus.date)} (${whenTxt(UI.focus.days)}). Зроби ідеї саме до цієї події.` : '';
  const prof = JSON.stringify(profileForAI(), null, 1);
  const LBL = {gifts:'подарунки', acts:'вчинки (що зробити своїми руками чи увагою)', dates:'місця й формати для побачень'};
  let prompt;
  if(!kind){
    prompt = `${AI_RULES}\n\nПрофіль (JSON):\n${prof}${focus}\n\nПідбери по 4 НОВІ ідеї у кожному розділі: подарунки, вчинки, побачення.
Ідеї, які вже зараз на екрані (запропонуй інші): ${['gifts','acts','dates'].flatMap(k=>(currentIdeas()[k]||[]).map(x=>x.title)).join('; ') || '—'}.
Уже виконані (не пропонуй їх і дуже схожі): ${doneTitles().join('; ') || '—'}.
Поверни лише JSON:
{"granny":"одне тепле речення від бабусі до ${S.user.name||'онуки'} (до 20 слів)","gifts":[{"title":"до 7 слів","why":"чому саме це, до 22 слів","meta":"ціна, напр. 400–700 ₴"}],"acts":[{"title":"...","why":"...","meta":"скільки часу, напр. 30 хв"}],"dates":[{"title":"...","why":"...","meta":"коли і бюджет, напр. вечір · до 800 ₴"}]}`;
  } else {
    const have = (currentIdeas()[kind]||[]).map(x=>x.title).join('; ');
    prompt = `${AI_RULES}\n\nПрофіль (JSON):\n${prof}${focus}\n\nПідбери 4 НОВІ ідеї в розділі: ${LBL[kind]}. Не повторюй: ${have || '—'}. Уже виконані (не пропонуй їх і дуже схожі): ${doneTitles(kind).join('; ') || '—'}.
Поверни лише JSON: {"items":[{"title":"до 7 слів","why":"чому саме це, до 22 слів","meta":"ціна або час"}]}`;
  }
  try{
    const res = await SAMPLE.json(prompt, {modelTier:'quick', signal:ctl.signal, cache:false});
    const clean = (arr, k) => (Array.isArray(arr)?arr:[]).filter(x=>x && typeof x.title==='string' && !isDone(k, String(x.title))).slice(0,6).map(x=>({title:String(x.title), why:String(x.why||''), meta:String(x.meta||'')}));
    if(!kind){
      const out = {src:'ai', gifts:clean(res.gifts,'gifts'), acts:clean(res.acts,'acts'), dates:clean(res.dates,'dates'), granny:String(res.granny||'')};
      if(!out.gifts.length && !out.acts.length && !out.dates.length) throw {code:'invalid_json'};
      S.ideas = out;
    } else {
      const items = clean(res.items, kind); if(!items.length) throw {code:'invalid_json'};
      const base = (S.ideas && S.ideas.src==='ai') ? S.ideas : {...currentIdeas(), src:'ai'};
      base[kind] = items; S.ideas = base;
    }
    S.ideasAt = Date.now(); useAI();
    toast(`Бабуся підібрала ідеї${aiLeft()!==Infinity ? ' · сьогодні залишилось '+aiLeft() : ''}`);
  }catch(e){
    const c = e && e.code;
    if(c==='cancelled'){}
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){ AI_STATE='off'; UI.aiNote=aiErrText(e, 'ШІ недоступний у цьому перегляді, тож показую ідеї за профілем.'); }
    else if(c==='rate_limited'){ UI.aiNote='Бабуся трохи втомилася від запитань. Спробуй за кілька хвилин.'; }
    else if(c==='session_expired'){ UI.aiNote='Потрібно знову увійти в акаунт Claude.'; }
    else { UI.aiNote=aiErrText(e, 'Бабуся задумалась і збилась із думки. Спробуй ще раз.'); }
  }finally{ UI.loading=false; UI.ctl=null; save(); render(); }
}

Не моралізуй, не звинувачуй жодну зі сторін, не став діагнозів. Можеш згадати діда Петра чи прислів’я, але не в кожній відповіді.
Якщо в розповіді є ознаки насильства, погроз, приниження чи контролю — м’яко, але чітко скажи, що так не має бути, і порадь звернутися на Національну гарячу лінію з питань домашнього насильства 116 123 (безкоштовно), а якщо є небезпека зараз — дзвонити 102.

async function sendChat(text){
  text = (text||'').trim(); if(!text || UI.chatBusy) return;
  if(AI_STATE!=='ready'){ toast(aiHowTo()); return; }
  if(chatLeft()<=0){ openSheet('sub', {reason:'chat'}); return; }
  if(S.chat.day!==TODAY){ S.chat.turns = S.chat.turns.slice(-6); }
  S.chat.turns.push({role:'user', content:text}); S.chat.turns.push({role:'assistant', content:'', pending:true});
  UI.chatBusy = true; renderSheet(); scrollChat();
  const ctl = new AbortController(); UI.chatCtl = ctl;
  const hist = S.chat.turns.filter(t=>!t.pending && t.content).slice(-12).map(t=>({role:t.role, content:t.content}));
  const last = S.chat.turns[S.chat.turns.length-1];
  try{
    const {text:ans} = await SAMPLE([{role:'user', content:chatRules()}, ...hist], {modelTier:'quick', cache:false, signal:ctl.signal,
      onText:({text})=>{ last.content=text; const b=$('#pending-msg'); if(b){ b.textContent=text; scrollChat(); } }});
    last.content = ans; delete last.pending; useChat();
  }catch(e){
    delete last.pending;
    const c = e && e.code;
    if(e && e.text){ last.content = e.text + (c==='cancelled' ? '' : ' …'); }
    else if(c==='cancelled'){ last.content = '('+G('ти зупинив','ти зупинила')+' відповідь)'; }
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){ AI_STATE='off'; last.content=aiErrText(e, 'Не можу зараз відповісти: ШІ недоступний у цьому перегляді.'); }
    else if(c==='rate_limited'){ last.content='Ох, забагато питань за раз. Дай бабусі кілька хвилин.'; }
    else if(c==='refused'){ last.content='Про це я говорити не буду, а от про стосунки — завжди будь ласка.'; }
    else { last.content=aiErrText(e, 'Щось зв’язок перервався. Спробуй ще раз.'); }
  }finally{ UI.chatBusy=false; UI.chatCtl=null; save(); renderSheet(); scrollChat(); }
}

// ---------- Бабусі: модель за віком і спільнота порадниць ----------
// Модель навчено в ml/life_stage_classifier.ipynb (логістична регресія, UCI Adult). Тут лише її коефіцієнти.
const MODEL = {"name":"life-stage-by-age","algorithm":"multinomial logistic regression (scikit-learn)","dataset":"UCI Adult (Census Income), 1994, CC BY 4.0","n_train":39073,"n_test":9769,"features":["a","a^2","a^3"],"age_min":17,"age_max":80,"age_mu":38.655363038415274,"age_sd":13.67802538177475,"scaler_mean":[0.0,0.99997441,0.52815071],"scaler_scale":[0.9999872,1.29489987,3.43353437],"classes":["divorced","married","single","widowed"],"coef":[[0.09293094,-0.52135768,0.20761291],[0.02934909,-0.37896179,0.28717121],[-1.46323035,0.7192684,-0.24805325],[1.34095032,0.18105107,-0.24673088]],"intercept":[0.36740138,1.33767267,0.77648907,-2.48156313],"metrics":{"accuracy":0.622,"macro_f1":0.348,"log_loss":0.909,"baseline_accuracy":0.459,"cv_accuracy_mean":0.625,"with_sex_accuracy_rejected":0.684},"topics":{"single":{"relationships":1.0,"kindness":0.2},"married":{"family":1.0,"relationships":0.4},"divorced":{"support":1.0,"relationships":0.3},"widowed":{"support":0.7,"kindness":0.8}}};
const STAGES = ['single','married','divorced','widowed'];
const STAGE_UA = {single:'Ще не в шлюбі', married:'У шлюбі', divorced:'Розлучення / окремо', widowed:'Вдівство'};
const STAGE_SHORT = {single:'Не в шлюбі', married:'У шлюбі', divorced:'Розлучення', widowed:'Вдівство'};
const TOPIC_UA = {relationships:'Стосунки', family:'Сім’я', kindness:'Доброта', support:'Підтримка'};
const TOPIC_D = {relationships:'Кохання, побачення, сварки й примирення', family:'Шлюб, діти, рідня і побут', kindness:'Як бути добрішими одне до одного й до себе', support:'Як пережити розрив, втрату чи важкий час'};
const GRANNY_SHARE = 0.8; // частка оплати, яку отримує бабуся

function predictStages(age){
  const M = MODEL, x = Math.min(M.age_max, Math.max(M.age_min, +age));
  const a = (x - M.age_mu) / M.age_sd;
  const f = [a, a*a, a*a*a].map((v,j) => (v - M.scaler_mean[j]) / M.scaler_scale[j]);
  const z = M.coef.map((w,k) => M.intercept[k] + w.reduce((s,wj,j) => s + wj*f[j], 0));
  const mx = Math.max(...z), e = z.map(v => Math.exp(v - mx)), sum = e.reduce((p,q) => p+q, 0);
  const out = {}; M.classes.forEach((c,k) => out[c] = e[k]/sum); return out;
}
function topicWeights(age){
  const p = predictStages(age), w = {relationships:0, family:0, kindness:0, support:0};
  for(const s in p){ const tt = MODEL.topics[s]; for(const t in tt) w[t] += p[s]*tt[t]; }
  return w;
}
function userAge(){ const a = parseInt(S.user.age, 10); return a >= 14 && a <= 110 ? a : null; }
function activeWeights(){
  const a = userAge();
  const w = a ? topicWeights(a) : {relationships:.5, family:.5, kindness:.5, support:.5};
  if(S.topicPick && w[S.topicPick] !== undefined){ for(const t in w) w[t] = t===S.topicPick ? 1.5 : w[t]*0.3; }
  return w;
}
function topTopic(){ const w = activeWeights(); return Object.keys(w).sort((x,y) => w[y]-w[x])[0]; }
function matchScore(g, w){
  const vals = Object.values(w).sort((x,y) => y-x), best = vals[0] + (vals[1]||0);
  return Math.round(Math.min(1, g.topics.reduce((s,t) => s + (w[t]||0), 0) / best) * 100);
}

function chartGeo(){
  const box = $('#chartBox'); const w = box ? box.clientWidth : 600;
  const W = Math.max(300, Math.min(1100, Math.round(w||600))), narrow = W < 480;
  return {W, H: narrow ? 220 : 250, L: 38, R: narrow ? 80 : 132, T: 14, B: 28, x0: 17, x1: 80, narrow};
}
function stageChartSVG(age, G0){
  const {W,H,L,R,T,B,x0,x1,narrow} = G0;
  const X = a => L + (a-x0)/(x1-x0)*(W-L-R), Y = v => T + (1-v)*(H-T-B);
  const ages = []; for(let a=x0; a<=x1; a++) ages.push(a);
  const P = ages.map(a => predictStages(a));
  let s = '';
  for(const v of [0,.25,.5,.75,1]) s += `<line class="ch-grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ch-axis" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v*100}%</text>`;
  for(let a=20; a<=80; a+=10) s += `<text class="ch-axis" x="${X(a)}" y="${H-8}" text-anchor="middle">${a}</text>`;
  for(const st of STAGES) s += `<path class="ch-line" style="stroke:var(--st-${st})" d="${P.map((p,i) => (i?'L':'M') + X(ages[i]).toFixed(1) + ' ' + Y(p[st]).toFixed(1)).join(' ')}"/>`;
  const ends = STAGES.map(st => ({st, y: Y(P[P.length-1][st])})).sort((p,q) => p.y-q.y);
  for(let i=1; i<ends.length; i++) if(ends[i].y - ends[i-1].y < 16) ends[i].y = ends[i-1].y + 16;
  ends.forEach(e => s += `<text class="ch-lbl" x="${W-R+8}" y="${e.y+4}">${(narrow?STAGE_SHORT:STAGE_UA)[e.st]}</text>`);
  const ya = Math.min(x1, Math.max(x0, age)), pa = predictStages(ya);
  s += `<line class="ch-you" x1="${X(ya)}" x2="${X(ya)}" y1="${T}" y2="${H-B}"/><text class="ch-axis" x="${X(ya) + (X(ya) > W-R-50 ? -6 : 6)}" y="${T+10}" text-anchor="${X(ya) > W-R-50 ? 'end' : 'start'}">${age} ${yearsWord(age)}</text>`;
  for(const st of STAGES) s += `<circle class="ch-dot" cx="${X(ya)}" cy="${Y(pa[st])}" r="4.5" style="fill:var(--st-${st})"/>`;
  s += `<line id="chCross" class="ch-cross" x1="0" x2="0" y1="${T}" y2="${H-B}" visibility="hidden"/>`;
  s += `<rect id="chHit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Ймовірність кожного життєвого етапу залежно від віку">${s}</svg>`;
}
function mountChart(){
  const box = $('#chartBox'); if(!box) return;
  const g = chartGeo(), age = UI.howAge || userAge() || 30;
  box.innerHTML = stageChartSVG(age, g) + '<div class="tip" id="chartTip" hidden></div>';
  const svg = box.querySelector('svg'), hit = box.querySelector('#chHit'), cross = box.querySelector('#chCross'), tip = box.querySelector('#chartTip');
  const X = a => g.L + (a-g.x0)/(g.x1-g.x0)*(g.W-g.L-g.R);
  const move = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * g.W / r.width;
    const a = Math.round(g.x0 + (px - g.L) / (g.W - g.L - g.R) * (g.x1 - g.x0)); if(a < g.x0 || a > g.x1) return;
    const p = predictStages(a);
    cross.setAttribute('x1', X(a)); cross.setAttribute('x2', X(a)); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${a} ${yearsWord(a)}</b>` + STAGES.slice().sort((x,y) => p[y]-p[x]).map(st => `<div class="r"><span class="row" style="gap:6px"><i class="sw" style="background:var(--st-${st})"></i>${STAGE_UA[st]}</span><b>${Math.round(p[st]*100)}%</b></div>`).join('');
    tip.hidden = false;
    const left = X(a) / g.W * r.width; const tw = tip.offsetWidth;
    tip.style.left = (left + 14 + tw > r.width ? left - tw - 14 : left + 14) + 'px'; tip.style.top = '8px';
  };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; });
}

let playTok = 0;
function stopPlay(){ playTok++; try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} UI.playing = null; }
function findMedia(id){ for(const g of allGrannies()) for(const m of mediaOf(g)) if(m.id===id) return {g, m}; return null; }
function playMedia(id){
  if(UI.playing===id){ stopPlay(); renderSheet(); return; }
  stopPlay(); const f = findMedia(id); if(!f || !f.m.text) return;
  let voice = null; try{ voice = (window.speechSynthesis ? speechSynthesis.getVoices() : []).find(v => /^uk/i.test(v.lang)) || null; }catch(e){}
  UI.playing = id; UI.voiceNote = voice ? '' : 'Українського голосу в цьому браузері немає, тож показую субтитри.';
  renderSheet();
  const tok = ++playTok, parts = f.m.text.split(/(?<=[.!?…])\s+/).filter(Boolean);
  const step = i => {
    if(tok !== playTok) return;
    if(i >= parts.length){ UI.playing = null; renderSheet(); return; }
    const el = $('#sub-' + id); if(el) el.textContent = parts[i];
    if(voice){ try{ const u = new SpeechSynthesisUtterance(parts[i]); u.voice = voice; u.lang = voice.lang; u.rate = .95; u.onend = () => step(i+1); u.onerror = () => setTimeout(() => step(i+1), 1500); speechSynthesis.speak(u); return; }catch(e){} }
    setTimeout(() => step(i+1), Math.max(1900, parts[i].length * 55));
  };
  step(0);
}

// ---- запис з мікрофона/камери (з запасним варіантом — файл) ----
let recTimer = null;
function recCleanup(){ clearInterval(recTimer); const r = UI.rec; if(r && r.stream){ r.stream.getTracks().forEach(t => t.stop()); r.stream = null; } }
async function recStart(){
  const r = UI.rec; if(!r) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)){ r.err = 'Запис у цьому перегляді недоступний. Завантаж готовий файл.'; renderSheet(); return; }
  try{ r.stream = await navigator.mediaDevices.getUserMedia({audio:true, video: r.kind==='video'}); }
  catch(e){ r.err = 'Немає доступу до '+(r.kind==='video'?'камери':'мікрофона')+'. Дозволь доступ у браузері або завантаж готовий файл.'; renderSheet(); return; }
  const chunks = []; const mr = new MediaRecorder(r.stream); r.mr = mr;
  mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => { const blob = new Blob(chunks, {type: mr.mimeType || (r.kind==='video'?'video/webm':'audio/webm')}); r.url = URL.createObjectURL(blob); r.state = 'done'; recCleanup(); renderSheet(); };
  mr.start(); r.state = 'rec'; r.secs = 0; renderSheet();
  const live = $('#recLive'); if(live) live.srcObject = r.stream;
  recTimer = setInterval(() => { r.secs++; const el = $('#recTime'); if(el) el.textContent = '0:' + String(r.secs).padStart(2,'0'); if(r.secs >= 60) ACTIONS.recStop(); }, 1000);
}

const GRANNY_ACTIONS = {
  setRole(v){ S.role = v; save(); render(); },
  ageQuick(){ const el = $('#ageQuick'); const a = parseInt(el && el.value, 10); if(!(a >= 16 && a <= 110)){ toast('Вкажи вік від 16 років'); return; } S.user.age = String(a); S.topicPick = null; save(); render(); toast('Підібрала бабусь під твій вік'); },
  pickTopic(v){ S.topicPick = v || null; save(); render(); },
  toggleHow(){ UI.how = !UI.how; UI.howAge = null; render(); },
  gTopic(v){ UI.gTopic = v; render(); },
  openGranny(v){ stopPlay(); openSheet('granny', v); },
  openAsk(v){ const g = grannyById(v); stopPlay(); UI.askText = ''; UI.askAnon = true; const tt = topTopic(); UI.askTopic = g.topics.includes(tt) ? tt : g.topics[0]; openSheet('ask', v); },
  askTopic(v){ UI.askTopic = v; renderSheet(); },
  toggleAnon(){ UI.askAnon = !UI.askAnon; renderSheet(); },
  sendQuestion(v){ const t = (UI.askText||'').trim(); if(t.length < 10){ toast('Розкажи трохи докладніше (хоча б кілька слів)'); return; }
    S.questions.unshift({id: uid(), grannyId: v, text: t, topic: UI.askTopic, anon: UI.askAnon, at: Date.now(), status: 'waiting'}); save(); closeSheet(); toast('Питання надіслано. Бабуся відповість '+(grannyById(v).reply)); },
  aiAnswer(v){ aiGrannyAnswer(v); },
  openConsult(v){ stopPlay(); UI.cFormat = 'video'; UI.cDate = null; UI.cTime = null; UI.cNote = ''; openSheet('consult', v); },
  cFormat(v){ UI.cFormat = v; renderSheet(); },
  cDate(v){ UI.cDate = v; UI.cTime = null; renderSheet(); },
  cTime(v){ UI.cTime = v; renderSheet(); },
  playMedia(v){ playMedia(v); },
  openRecord(v){ recCleanup(); UI.rec = {kind: v, state: 'idle'}; UI.recTitle = ''; const g = grannyById(S.asGranny) || GRANNIES[0]; UI.recTopic = g.topics[0]; openSheet('record'); },
  recStart(){ recStart(); },
  recStop(){ const r = UI.rec; clearInterval(recTimer); if(r && r.mr && r.mr.state !== 'inactive') r.mr.stop(); },
  recReset(){ recCleanup(); UI.rec = {kind: UI.rec.kind, state: 'idle'}; renderSheet(); },
  recTopic(v){ UI.recTopic = v; renderSheet(); },

async function aiGrannyAnswer(qid){

Відповідай українською від першої особи, тепло й по-бабусиному, 4–6 речень. Наприкінці — одна конкретна маленька дія. Можеш спиратися на свою біографію вище, але не вигадуй нових фактів про себе. Не моралізуй, не звинувачуй жодну зі сторін, не став діагнозів.
Якщо є ознаки насильства, погроз, приниження чи контролю — м’яко, але чітко скажи, що так не має бути, і порадь Національну гарячу лінію 116 123, а при небезпеці зараз — 102.
Тема: ${TOPIC_UA[q.topic]}. Питання: ${q.text}`;
  try{
    const {text} = await SAMPLE(prompt, {modelTier:'quick', cache:false, onText: ({text}) => { const el = $('#ans-'+qid); if(el) el.textContent = text; }});
    q.answer = text; q.status = 'answered'; q.by = 'ai'; q.answeredAt = Date.now();

    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){ AI_STATE = 'off'; toast(aiErrText(e, 'ШІ недоступний у цьому перегляді')); }

    else if(c!=='cancelled') toast(aiErrText(e, 'Не вдалося отримати відповідь. Спробуй ще раз.'));
  }finally{ UI.aiQ = null; save(); render(); }
}

const KIND_UA = {gift:'Подарунок', service:'Послуга', experience:'Враження'};
const KIND_CHIPS = [['gift','Подарунки'],['service','Послуги'],['experience','Враження']];

let SEARCH_MODE = 'links', SEARCH_HINT = '';

function storeLinks(q, kind, city){
  const e = encodeURIComponent, words = q.trim().split(/\s+/).map(e).join('-');
  if(kind === 'gift') return [['Rozetka', 'https://rozetka.com.ua/ua/search/?text=' + e(q)], ['Prom', 'https://prom.ua/ua/search?search_term=' + e(q)],
    ['OLX', 'https://www.olx.ua/uk/list/q-' + words + '/'], ['Google', 'https://www.google.com/search?q=' + e(q)]];
  const qq = city ? q + ' ' + city : q;
  return [['Google', 'https://www.google.com/search?q=' + e(qq)], ['Карти', 'https://www.google.com/maps/search/' + e(qq)]];
}
function safeUrl(u){ try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; }catch(e){ return ''; } }
function searchEvent(){ return UI.focus || events().find(e => e.own && e.days <= 30) || null; }
function searchModeText(){
  if(SEARCH_MODE === 'claude') return 'Шукаю в інтернеті через Claude: справжні товари й послуги з посиланнями.';

}

async function suggestShopQueries(t){
  if(AI_STATE === 'ready'){
    try{
      const res = await SAMPLE.json(`${AI_RULES}\n\nПідбери 6 конкретних ідей, які можна знайти в українських інтернет-магазинах і сервісах, і для кожної склади короткий пошуковий запит.\n${taskText(t)}\n\nПоверни лише JSON: {"items":[{"title":"до 7 слів","query":"пошуковий запит для магазину, до 6 слів, без ціни","why":"чому підходить, до 20 слів","kind":"gift|service|experience","budget":"орієнтовна ціна, напр. 500–900 ₴"}]}`, {modelTier:'quick', cache:false});
      const items = (res && res.items || []).filter(x => x && x.title && x.query).slice(0, 8).map(x => ({title:String(x.title), query:String(x.query), why:String(x.why||''),
        kind: KIND_UA[x.kind] ? x.kind : 'gift', budget:String(x.budget||'')}));
      if(items.length) return {items, by:'ai'};
    }catch(e){}
  }
  const r = ruleIdeas(UI.focus), out = [];
  if(t.context) out.push({title:t.context, query:t.context, why:'Твій запит', kind:t.kinds[0] || 'gift', budget:t.budget});
  if(t.kinds.includes('gift')) r.gifts.slice(0, 4).forEach(g => out.push({title:g.title, query:g.title.replace(/:/g, ''), why:g.why, kind:'gift', budget:g.meta}));
  if(t.kinds.includes('experience') || t.kinds.includes('service')) r.dates.slice(0, 3).forEach(d => out.push({title:d.title, query:d.title, why:d.why, kind:'experience', budget:d.meta}));
  return {items: out.filter(x => !t.exclude.includes(x.title)).slice(0, 7), by:'rules'};
}
async function runSearch(more){
  if(UI.sBusy) return;
  if(!UI.sKinds.length){ toast('Обери, що шукати: подарунки, послуги чи враження'); return; }
  const t = searchTask(more);
  UI.sBusy = true; UI.sErr = ''; UI.sLine = 0; const ctl = new AbortController(); UI.sCtl = ctl; render();
  const tick = setInterval(() => { UI.sLine = (UI.sLine + 1) % SEARCH_LINES.length; const el = $('#sline'); if(el) el.textContent = SEARCH_LINES[UI.sLine].replace('{name}', pName()); }, 2600);
  try{
    let res = null;
    if(SEARCH_MODE === 'claude' || SEARCH_MODE === 'ollama'){
      const r = await fetch('/api/search', {method:'POST', headers:{'Content-Type':'application/json', 'X-Babusya':'1'}, body:JSON.stringify(t), signal:ctl.signal});
      const j = await r.json().catch(() => ({}));
      const items = (j.items || []).map(x => ({...x, url: safeUrl(x.url)})).filter(x => x.url && x.title);
      if(r.ok && items.length) res = {mode:'web', source:j.source, items};
      else UI.sErr = r.ok ? 'В інтернеті не знайшлося відповідних сторінок, тож показую, що пошукати в магазинах.' : (j.message || 'Пошук не вдався.') + ' Показую, що пошукати в магазинах.';
    }
    if(!res){ const s = await suggestShopQueries(t); res = {mode:'links', by:s.by, items:s.items}; }
    S.search = {...res, query:t.context, kinds:t.kinds, budget:t.budget, at:Date.now()}; save();
  }catch(e){ if(!(e && e.name === 'AbortError')) UI.sErr = 'Пошук не вдався. Спробуй ще раз.'; }
  finally{ clearInterval(tick); UI.sBusy = false; UI.sCtl = null; render(); }
}

  tab(v){ S.tab=v; save(); render(); window.scrollTo(0,0); },
  jump(v){ closeSheetQuiet(); if(v==='onb'){ S.onboarded=false; S.obStep=0; } else { if(!S.onboarded){ if(!S.partner.name) example(); S.onboarded=true; } S.tab=v; } save(); render(); window.scrollTo(0,0); },
  set(v){ const [p,val]=v.split('='); setPath(p,val); if(p==='partner.pron'||p==='user.kind'||p==='partner.love'){ S.ideas = S.ideas&&S.ideas.src==='ai'?S.ideas:null; } rerender(); },
  toggleInterest(v){ const a=S.partner.interests; const i=a.indexOf(v); i>=0?a.splice(i,1):a.push(v); save(); rerender(); },
  addInterest(){ const el=$('#customInterest'); const v=(el&&el.value||'').trim(); if(!v) return; if(!S.partner.interests.includes(v)) S.partner.interests.push(v); save(); rerender(); },
  obNext(v){
    if(S.obStep===7 && !S.notif.allowed && v!=='skip'){ askNotif(()=>{ S.obStep++; save(); render(); }); return; }
    if(S.obStep>=OB_STEPS-1){ S.onboarded=true; S.tab='today'; save(); render(); window.scrollTo(0,0); setTimeout(()=>{ if(!UI.pushed){ UI.pushed=true; const ev=events()[0]; if(ev && ev.own) showPush(ev.title+' '+whenTxt(ev.days), 'Я вже маю кілька ідей. Заглянь, поки є час.', 'ideas:'+ev.id); else testPush(); } }, 3500); return; }
    S.obStep++; save(); render();
  },
  obBack(){ S.obStep=Math.max(0,S.obStep-1); save(); render(); },
  fillExample(){ example(); S.tab='today'; render(); toast('Профіль заповнено прикладом: Олена з Києва'); },
  restartOnb(){ S.onboarded=false; S.obStep=0; save(); render(); },
  resetAll(){ if(UI.confirmReset){ UI.confirmReset=false; S=freshState(); UI.focus=null; save(); closeSheetQuiet(); render(); toast('Усе стерто. Починаємо спочатку.'); } else { UI.confirmReset=true; toast('Натисни «Стерти все» ще раз, щоб підтвердити'); setTimeout(()=>UI.confirmReset=false, 4000); } },
  togglePro(){ if(isPro()){ S.premium=null; } else { S.premium='year'; S.premiumSince=Date.now(); } save(); render(); renderSheet(); toast(isPro()?'Бабусина скриня увімкнена (тест)':'Скриню вимкнено (тест)'); },
  taskDone(v){ if(S.tasksDone[TODAY]===+v){ delete S.tasksDone[TODAY]; } else { S.tasksDone[TODAY]=+v; toast(fillVoc(PRAISE[Math.floor(Math.random()*PRAISE.length)])); } save(); render(); },
  saveAdvice(v){ const i=S.savedAdvice.indexOf(+v); if(i>=0){ S.savedAdvice.splice(i,1); toast('Прибрано зі збережених'); } else { S.savedAdvice.push(+v); toast('Збережено в зошит'); } save(); render(); renderSheet(); },
  share(v){ const a=ADVICE[+v]; const txt=`${a.t}\n${fillVoc(a.x)}\n— Бабуся Ганна, «Поради бабусі»`;
    try{ navigator.clipboard.writeText(txt).then(()=>toast('Пораду скопійовано'), ()=>toast('Не вдалося скопіювати')); }catch(e){ toast('Не вдалося скопіювати'); } },
  adviceCat(v){ UI.adviceCat=v; render(); },
  openAdvice(v){ openSheet('advice', v); render(); },
  openSub(){ openSheet('sub', {}); },
  openDonate(){ UI.treat=1; UI.custom=''; openSheet('donate'); },
  openChat(){ openSheet('chat'); },
  pickPlan(v){ UI.plan=v; renderSheet(); },
  pickTreat(v){ UI.treat=+v; renderSheet(); },
  pickMethod(v){ UI.method=v; renderSheet(); },
  goPay(v){
    if(v==='sub'){ const pl=PLANS[UI.plan]; UI.pay={kind:'sub', plan:UI.plan, amount:pl.price, label:'Бабусина скриня · '+pl.t.toLowerCase()}; }
    else if(v==='consult'){ const g=grannyById(UI.arg); const f=UI.cFormat||'video';
      if(!UI.cDate){ toast('Обери день'); return; } if(f!=='chat' && !UI.cTime){ toast('Обери час'); return; }
      const fm=C_FORMATS.find(x=>x.id===f), d=nextDays(7).find(x=>x.iso===UI.cDate), price=cPrice(g,f);
      UI.pay={kind:'consult', amount:price, label:fm.t+' · '+g.short, booking:{grannyId:g.id, format:f, formatLabel:fm.t, date:UI.cDate, dateLabel:d?d.label:UI.cDate, time:f==='chat'?'з цього дня':UI.cTime, price, note:(UI.cNote||'').trim()}}; }
    else { const tr=TREATS[UI.treat]; const a=tr.a||(+UI.custom||0); if(a<10) return; UI.pay={kind:'donate', amount:a, label:tr.a?tr.t:'Частування від серця'}; }
    UI.payDone=false; UI.paying=false; UI.sheet='pay'; renderSheet();
  },
  pay(){ UI.paying=true; renderSheet(); setTimeout(()=>{ const p=UI.pay; if(p.kind==='sub'){ S.premium=p.plan; S.premiumSince=Date.now(); } else if(p.kind==='consult'){ S.bookings.unshift({...p.booking, id:uid(), at:Date.now()}); } else { S.donations.push({a:p.amount, at:Date.now()}); } save(); UI.paying=false; UI.payDone=true; renderSheet(); render(); }, 1400); },
  cancelSub(){ S.premium=null; save(); closeSheet(); toast('Підписку скасовано. Бабуся не ображається.'); },
  closeSheet(){ closeSheet(); },
  runAI(){ runAI(); },
  stopAI(){ if(UI.ctl) UI.ctl.abort(); },
  moreIdeas(){ const k=UI.ideasTab;
    if(AI_STATE==='ready'){ if(aiLeft()<=0){ openSheet('sub',{reason:'ai'}); return; } runAI(k); return; }
    const cur = (currentIdeas()[k]||[]).map(x=>x.title); const r = freshRules(k, cur);
    S.ideas[k] = r.items; save(); render();
    toast(r.exhausted ? 'Нових ідей за профілем поки немає. Додай більше інтересів у профілі.' : 'Ось нові ідеї'); },
  ideasTab(v){ UI.ideasTab=v; render(); },
  toggleSaved(){ UI.showSaved=!UI.showSaved; render(); },
  saveIdea(v, el){ const i=S.savedIdeas.findIndex(s=>s.id===v); if(i>=0){ S.savedIdeas.splice(i,1); toast('Прибрано зі збережених'); } else { const k=el.dataset.k; const all=[...(currentIdeas()[k]||[])]; const it=all.find(x=>hash(k+x.title)===v); if(it){ S.savedIdeas.push({...it, id:v, kind:k}); toast('Ідею відкладено на потім'); } } save(); render(); },
  doneIdea(v, el){ const i=S.doneIdeas.findIndex(d=>d.id===v);
    if(i>=0) S.doneIdeas.splice(i,1);
    else { const k=el.dataset.k; const it=[...(currentIdeas()[k]||[]), ...S.savedIdeas].find(x=>hash(k+x.title)===v) || {};
      S.doneIdeas.push({id:v, kind:k, title:it.title||'', why:it.why||'', meta:it.meta||'', at:Date.now()}); toast(fillVoc(PRAISE[Math.floor(Math.random()*PRAISE.length)])); }
    save(); render(); },
  focusEvent(v){ const e=events().find(x=>String(x.id)===String(v)); if(e){ UI.focus=e; UI.ideasTab = e.type==='anniv'?'dates':'gifts'; if(!(S.ideas&&S.ideas.src==='ai')) S.ideas=null; } S.tab='ideas'; UI.showSaved=false; save(); render(); window.scrollTo(0,0); },
  clearFocus(){ UI.focus=null; if(!(S.ideas&&S.ideas.src==='ai')) S.ideas=null; render(); },
  chatSend(){ const el=$('#chatInput'); const t=el?el.value:''; if(el) el.value=''; sendChat(t); },
  chatSuggest(v){ sendChat(v); },
  chatStop(){ if(UI.chatCtl) UI.chatCtl.abort(); },
  edit(v){ openSheet('edit', v); },
  openAddDate(){ UI.newType='bday'; UI.newTitle=''; UI.newDate=''; openSheet('addDate'); },
  newType(v){ UI.newType=v; if(!UI.newTitle || Object.values(DATE_TYPES).some(x=>UI.newTitle.startsWith(x))) UI.newTitle = DATE_TYPES[v]==='Інша подія' ? '' : DATE_TYPES[v]; renderSheet(); },
  saveDate(){ const t=(UI.newTitle||'').trim()||DATE_TYPES[UI.newType||'other'], d=UI.newDate; if(!d){ toast('Вкажи дату'); return; } S.partner.dates.push({id:uid(), type:UI.newType||'other', title:t, date:d}); save(); closeSheet(); toast('Дату додано. Бабуся нагадає.'); },
  delDate(v){ S.partner.dates=S.partner.dates.filter(d=>d.id!==v); save(); render(); toast('Дату видалено'); },
  addHabit(){ const el=$('#newHabit'); const v=(el&&el.value||'').trim(); if(!v) return; S.partner.habits.push(v); save(); renderSheet(); render(); },
  delHabit(v){ S.partner.habits.splice(+v,1); save(); renderSheet(); render(); },
  toggleNotif(v){ S.notif[v]=!S.notif[v]; if(v!=='holidays' && S.notif[v] && !S.notif.allowed){ askNotif(()=>render()); } save(); render(); },
  setLead(v){ if(!isPro() && +v>3){ openSheet('sub',{reason:'lead'}); return; } S.notif.lead=+v; save(); render(); },
  askNotif(){ askNotif(()=>render()); },
  notifAns(v){ $('#sysalert').hidden=true; S.notif.allowed = v==='yes'; save(); if(v!=='yes') toast('Добре. Увімкнути можна у розділі «Дати».'); const f=UI.afterNotif; UI.afterNotif=null; if(f) f(); else render(); },
  testPush(){ testPush(); },
  photoPick(){ $('#photoInput').click(); },
  photoReset(){ S.photo=''; save(); render(); },
};
function closeSheetQuiet(){ stopPlay(); recCleanup(); $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); UI.sheet=null; syncLock(); }
function rerender(){ if(UI.sheet) renderSheet(); render(); }

document.addEventListener('click', e=>{
  const pushEl = e.target.closest('#push');
  if(pushEl){ pushEl.classList.remove('on'); const go=pushEl.dataset.go||''; if(!S.onboarded) return; closeSheetQuiet();
    if(go.startsWith('ideas:')) ACTIONS.focusEvent(go.slice(6)); else if(go) ACTIONS.tab(go); return; }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if(fn){ e.preventDefault(); fn(el.dataset.v, el, e); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.bind){ setPath(t.dataset.bind, t.value); if(S.ideas && S.ideas.src!=='ai') S.ideas=null; if(t.dataset.bind.startsWith('notif.')) render(); }
  if(t.dataset.ui){ UI[t.dataset.ui]=t.value; if(t.dataset.ui==='custom'){ const b=$('#donateBtn'); const a=+t.value||0; if(b){ b.disabled=a<10; b.textContent='Пригостити'+(a>=10?' за '+a+' ₴':''); } } }
  if(t.dataset.join && UI.join){ UI.join[t.dataset.join]=t.value; }
  if(t.id==='howAge'){ UI.howAge=+t.value; const l=$('#howAgeV'); if(l) l.textContent=t.value+' '+yearsWord(+t.value); mountChart(); }
  if(t.dataset.bind==='user.age'){ S.topicPick=null; }
  if(t.dataset.obdate){ const type=t.dataset.obdate; const ps=S.partner; const ex=ps.dates.find(d=>d.type===type);
    if(t.value){ if(ex) ex.date=t.value; else ps.dates.push({id:uid(), type, title: type==='bday' ? 'День народження'+(ps.name?' · '+ps.name:'') : 'Річниця стосунків', date:t.value}); }
    else if(ex){ ps.dates=ps.dates.filter(d=>d!==ex); } save(); }
});
document.addEventListener('keydown', e=>{
  if(e.target.id==='chatInput' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ACTIONS.chatSend(); }
  if(e.target.id==='customInterest' && e.key==='Enter'){ e.preventDefault(); ACTIONS.addInterest(); }
  if(e.target.id==='sq' && e.key==='Enter'){ e.preventDefault(); runSearch(false); }
  if(e.target.id==='newHabit' && e.key==='Enter'){ e.preventDefault(); ACTIONS.addHabit(); }
  if(e.key==='Escape' && UI.sheet) closeSheet();
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='asGranny'){ S.asGranny=t.value; save(); render(); }
  if(t.id==='recFile' && t.files && t.files[0] && UI.rec){ const f=t.files[0]; UI.rec.url=URL.createObjectURL(f); UI.rec.kind=f.type.startsWith('video')?'video':'audio'; UI.rec.state='done'; UI.rec.secs=0; if(!UI.recTitle) UI.recTitle=f.name.replace(/\.[^.]+$/,''); renderSheet(); }
  if(t.dataset.bind==='user.age' && S.onboarded && S.tab==='grannies') render();
});
$('#photoInput').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
      const s = 320, c = document.createElement('canvas'); c.width = s; c.height = s; const ctx = c.getContext('2d');
      const m = Math.min(img.width, img.height); ctx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, s, s);
      try{ S.photo = c.toDataURL('image/jpeg', .85); save(); render(); toast('Фото бабусі оновлено'); }catch(err){ toast('Не вдалося обробити фото'); }
    }; img.onerror = () => toast('Це не схоже на зображення'); img.src = r.result; };
  r.readAsDataURL(f); e.target.value='';
});
let rsT=null; window.addEventListener('resize', ()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ renderSidebar(); mountChart(); }, 150); });
document.addEventListener('toggle', e=>{ if(e.target && e.target.id==='testerBox') UI.testerOpen = e.target.open; }, true);

render();
</script>

</body>
</html>
